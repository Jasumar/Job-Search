[project]
name = "jobsearch-monorepo"
version = "0.1.0"
description = "Local-first job search agent — uv workspace root (virtual, not packaged)"
requires-python = ">=3.11"
dependencies = [
    "jobsearch-core",
    "jobsearch",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "respx>=0.22",
    "ddgs>=0.5",
    "playwright>=1.62",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/*",
    "apps/*",
]
# apps/web is an npm/Vite app with no Python package — it must not be a uv member.
exclude = ["apps/web"]

[tool.uv.sources]
jobsearch-core = { workspace = true }
jobsearch = { workspace = true }

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
