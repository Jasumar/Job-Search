# Role taxonomy (MF3): broad groups, each with common roles. Data, not code.
#
# A role's full id is "<group>/<role>" (e.g. "technology/backend"); a group id
# alone ("technology") selects every role in it. The profile stores these ids in
# `role_families`; job-profile extraction records a job's `job_group` and
# `job_role` from this list (or "other"); the score compares them in code.
#
# `keywords` are job-title words or phrases. They rank unprofiled jobs before
# extraction (prefit) and stop a job from being hidden as "not your role" when
# its title names a selected role. Matching is whole-word and case-free, so keep
# each keyword specific: "engineer" alone would match every engineering title.
#
# The owner can also type free-text roles; those are mapped to these ids once,
# when typed, and stored with the profile.

groups:
  - id: technology
    label: Technology & software
    roles:
      - {id: software-engineer, label: Software engineer, keywords: [software engineer, software developer, developer, programmer, ohjelmistokehittäjä, ohjelmistosuunnittelija]}
      - {id: backend, label: Backend developer, keywords: [backend, back-end, back end, python developer, java developer, node.js developer, api developer]}
      - {id: frontend, label: Frontend developer, keywords: [frontend, front-end, front end, react developer, web developer]}
      - {id: fullstack, label: Full-stack developer, keywords: [full stack, full-stack, fullstack]}
      - {id: mobile, label: Mobile developer, keywords: [mobile developer, ios developer, android developer, mobile engineer]}
      - {id: devops, label: DevOps & platform engineer, keywords: [devops, platform engineer, site reliability, sre, cloud engineer, infrastructure engineer, automation engineer, ci/cd]}
      - {id: data-engineer, label: Data engineer, keywords: [data engineer, data platform, etl developer, analytics engineer]}
      - {id: data-analyst, label: Data analyst, keywords: [data analyst, business intelligence, bi developer, bi analyst, analytics]}
      - {id: data-scientist, label: Data scientist, keywords: [data scientist, data science]}
      - {id: ml-engineer, label: AI / machine learning engineer, keywords: [machine learning, ml engineer, ai engineer, mlops, llm, nlp, deep learning, computer vision]}
