  - tookohad
  - tood
  - oferty
  - pracy
  - praca
  - kariera
  - stanowiska

# Section scoping words: a listing surface may be named by its section plus one
# of these ("/avoimet-tyopaikat/kaikki"), and the last segment is then the
# section modifier, not a listing term. They never make a page an entry on
# their own — the extractor still has to find postings on it.
section_modifiers:
  - all
  - kaikki
  - search
  - results
  - search results
  - join us
  - list
  - open
  - browse
  - haku
  - sok
  - alle
  - koik
  - wszystkie
  - visos
  - visi

# A subset listing: a page that lists *some* of the postings (one category, one
# team, one location, one audience). Such a page may rescue a descent that found
# nothing, but it never displaces a page that already lists postings — the
# Amazon /job_categories and Nordea /internships-student-jobs traps.
subset_segments:
  - categories
  - category
  - teams
  - team
  - locations
  - location
  - departments
  - department
  - internships
  - internship
  - students
  - student
  - graduates
  - graduate
  - trainees
  - trainee
  - apprentices
