# Path tokens that name a listing surface. Scored per token on the candidate
# URL path; a candidate whose last path segment carries no listing token and no
# section modifier is a posting or a section page, not an entry.
path_terms:
  - jobs
  - job
  - careers
  - career
  - vacancies
  - vacancy
  - positions
  - position
  - openings
  - opening
  - opportunities
  - listings
  - avoimet
  - tyopaikat
  - tyopaikka
  - tehtavat
  - urat
  - ura
  - rekrytointi
