# Careers-page entry resolution vocabulary (Phase 4.0d, plan-scraping.md
# §Careers-page work §Entry resolution).
#
# A landing page is resolved to the real open-positions page by ranking its
# links against this list, then letting the extractor decide which page is the
# listing. The list only orders the bounded fetches (MAX_HOPS rounds, three
# fetches per round, a per-company cap); a page with no postings is never
# accepted as the entry, however well its label scores.
#
# Matching folds diacritics and case, so "tyopaikat" and "Työpaikat" both match
# "työpaikat". Add a term here instead of a regex in code: the vocabulary is
# the whole language layer.
#
# Keep terms language-generic rather than employer-specific. "urat"/"uramme"
# (our careers) are included because they are the standard Finnish nav label for
# the jobs section, not because they guarantee a listing page — the extractor
# check covers that.

