# Every ISO 3166-1 country (MF6): alpha-2 code, the display name, and common
# aliases (other English names, local names, short forms). Data, not code:
# profile.KNOWN_COUNTRIES, search/templates.COUNTRIES, GET /segments and the
# matcher's country comparison all read this file.
#
# Matching folds case and accents and compares whole names through this table,
# never by substring ("india" must not match "indiana").
#
# `discovery_default` is the country set discovery queries when the profile
# names no country. It is a budget choice, not a vocabulary limit.

discovery_default: [FI, SE, EE, DK, DE, NL]

