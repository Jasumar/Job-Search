services:
  searxng:
    image: searxng/searxng:latest
    container_name: jobsearch-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/etc/searxng/data
    environment:
      - SEARXNG_SECRET=jobsearch-local-dev-secret
    restart: unless-stopped

volumes:
  searxng-data:
